<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management Dashboard Ritheeck Dharan M</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>
            <div id="dateTime" class="datetime"></div>
        </header>

        <div id="statusMessage" class="status-msg"></div>

        <section class="metrics-bar">
            <div class="metric-box">
                <span class="label">Total Employees</span>
                <span id="employeeCount" class="val">0</span>
            </div>
            <div class="metric-box">
                <span class="label">Total Salary</span>
                <span id="totalSalary" class="val">₹0</span>
            </div>
            <div class="metric-box">
                <span class="label">Average Salary</span>
                <span id="avgSalary" class="val">₹0</span>
            </div>
            <div class="metric-box highlight">
                <span class="label">Highest Paid Employee</span>
                <span id="highestPaid" class="val">None</span>
            </div>
        </section>

        <section class="controls">
            <div class="search-group">
                <input type="text" id="searchInput" placeholder="Search employee by name...">
                <button type="button" onclick="searchEmployees()">Search</button>
            </div>

            <div class="filter-group">
                <button type="button" class="filter-btn active" onclick="filterDepartment('All')">All Employees</button>
                <button type="button" class="filter-btn" onclick="filterDepartment('IT')">IT</button>
                <button type="button" class="filter-btn" onclick="filterDepartment('HR')">HR</button>
                <button type="button" class="filter-btn" onclick="filterDepartment('Finance')">Finance</button>
                <button type="button" class="filter-btn" onclick="filterDepartment('Marketing')">Marketing</button>
            </div>

            <div class="sort-group">
                <select id="sortSelect" onchange="sortEmployees(this.value)">
                    <option value="">Sort By</option>
                    <option value="name-asc">Name ↑</option>
                    <option value="name-desc">Name ↓</option>
                    <option value="age-asc">Age ↑</option>
                    <option value="age-desc">Age ↓</option>
                    <option value="salary-asc">Salary ↑</option>
                    <option value="salary-desc">Salary ↓</option>
                </select>
            </div>
        </section>

        <section id="cardContainer" class="card-container">
        </section>

        <section class="form-container">
            <h2>ADD EMPLOYEE</h2>
            <div id="errorBox" class="error-msg"></div>

            <form id="addEmployeeForm" onsubmit="addEmployee(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="empName">Name *</label>
                        <input type="text" id="empName" placeholder="Enter name">
                    </div>
                    <div class="form-group">
                        <label for="empAge">Age *</label>
                        <input type="number" id="empAge" placeholder="Enter age (> 18)">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="empEmail">Email *</label>
                        <input type="email" id="empEmail" placeholder="Enter email address">
                    </div>
                    <div class="form-group">
                        <label for="empPhone">Phone</label>
                        <input type="text" id="empPhone" placeholder="Enter phone number">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="empDept">Department *</label>
                        <select id="empDept">
                            <option value="">-- Select Department --</option>
                            <option value="IT">IT</option>
                            <option value="HR">HR</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="empSalary">Salary (₹)</label>
                        <input type="number" id="empSalary" placeholder="Enter salary (Default: 50000)">
                    </div>
                </div>

                <div class="form-group">
                    <label for="empImage">Image URL</label>
                    <input type="text" id="empImage" placeholder="Paste image link here...">
                </div>

                <button type="submit" class="submit-btn">Add Employee</button>
            </form>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
